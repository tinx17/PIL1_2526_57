<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise à jour mot de passe</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="assets/js/script.js"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="login-card">
        
        <div class="login-header">
            <img src="assets/images/logo_groupe_57_v3 (1).png" alt="Logo" class="project-logo">
        </div>

        <div class="login-welcome">
            <h1>Mise à jour du Mot de passe</h1>
        </div>
       
            


        <form class="login-form">
            
            <div class="input-group">
                <label>Email</label>
                <div class="input-field">
                    <i class="fa-regular fa-user icon"></i>
                    <input type="email" placeholder="Entrez votre email" required>
                </div>
            </div>

            <div class="input-group">
                <label>Nouveau mot de passe</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" placeholder="Nouveau mot de passe" required>
                </div>
            </div>

            <div class="input-group">
                <label>*Nouveau mot de passe</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock icon"></i>
                    <input type="password" placeholder="Confirmez votre mot de passe" required>
                </div>
            </div>
            <button type="submit" class="btn-login">Confirmez</button>

    

        </form>
    </div>

    <script link = ></script>
</body>
</html>
