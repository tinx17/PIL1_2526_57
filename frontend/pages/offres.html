<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offres & Demandes - IFRI_MentorLink</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <nav>
    <div class="container">
      <div class="brand">IFRI_MentorLink</div>
      <div class="nav-links">
        <a href="../index.html">Accueil</a>
        <a href="correspondances.html">Correspondances</a>
        <a href="offres.html">Offres & Demandes</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1>Offres & Demandes de Mentorat</h1>
    <p>Publiez ou recherchez du mentorat</p>
    
    <section class="offres-container">
      <div class="form-section">
        <h2>Créer une offre</h2>
        <form class="offer-form">
          <input type="text" placeholder="Matière" required>
          <textarea placeholder="Description" required></textarea>
          <input type="text" placeholder="Disponibilités" required>
          <button type="submit" class="btn btn-primary">Publier</button>
        </form>
      </div>
      
      <div class="offres-list">
        <h2>Offres disponibles</h2>
        <p>Les offres apparaîtront ici</p>
      </div>
    </section>
  </main>

  <script src="../script.js"></script>
</body>
</html>
