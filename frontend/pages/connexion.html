<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — IFRI_MentorLink</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
    <link rel="shortcut icon" href="../assets/img/icon.png" type="image/x-icon" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-icon">
            <i data-lucide="log-in"></i>
          </div>
          <h1>Bienvenue</h1>
          <p>Connectez-vous pour accéder à votre espace</p>
        </div>

        <form class="auth-form" id="form-connexion" novalidate>
          <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <div class="input-wrapper">
              <i data-lucide="mail" class="input-icon"></i>
              <input
                type="email"
                id="email"
                placeholder="votre@email.com"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="mot-de-passe">Mot de passe</label>
            <div class="input-wrapper">
              <i data-lucide="lock" class="input-icon"></i>
              <input
                type="password"
                id="mot-de-passe"
                placeholder="Votre mot de passe"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="toggle-mdp"
                id="toggle-mdp"
                aria-label="Afficher le mot de passe"
              >
                <i data-lucide="eye"></i>
              </button>
            </div>
          </div>

          <div class="auth-options">
            <label>
              <input type="checkbox" id="souvenir" />
              Se souvenir de moi
            </label>
            <a href="reinitialiser_mdp.html">Mot de passe oublié ?</a>
          </div>

          <p class="form-error" id="erreur-connexion"></p>

          <button type="submit" class="btn btn-primary">
            <i data-lucide="log-in"></i>
            Se connecter
          </button>
        </form>

        <p class="auth-separator">
          Pas encore de compte ?
          <a href="inscription.html">S'inscrire</a>
        </p>
      </div>
    </div>

    <script src="../JS/script.js"></script>
  </body>
</html>
