<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — IFRI_MentorLink</title>
    <link rel="stylesheet" href="../CSS/styles.css" />
    <link rel="shortcut icon" href="../assets/img/icon.png" type="image/x-icon" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card auth-card--wide">
        <div class="auth-header">
          <div class="auth-icon">
            <i data-lucide="user-round-plus"></i>
          </div>
          <h1>Créer un compte</h1>
          <p>Rejoignez la communauté IFRI_MentorLink</p>
        </div>

        <div class="etapes-indicateur" id="etapes-indicateur">
          <div class="etape-point active" id="point-1">
            <div class="etape-cercle">
              <span>1</span>
              <i data-lucide="check"></i>
            </div>
            <span class="etape-label">Identité</span>
          </div>
          <div class="etape-trait" id="trait-1"></div>
          <div class="etape-point" id="point-2">
            <div class="etape-cercle">
              <span>2</span>
              <i data-lucide="check"></i>
            </div>
            <span class="etape-label">Parcours</span>
          </div>
          <div class="etape-trait" id="trait-2"></div>
          <div class="etape-point" id="point-3">
            <div class="etape-cercle">
              <span>3</span>
              <i data-lucide="check"></i>
            </div>
            <span class="etape-label">Compétences</span>
          </div>
        </div>

        <form class="auth-form" id="form-inscription" novalidate>
          <div class="form-step active-step" id="step-1">
            <div class="form-group">
              <label for="nom">Nom</label>
              <div class="input-wrapper">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" id="nom" placeholder="Votre nom" required />
              </div>
            </div>
            <div class="form-group">
              <label for="prenom">Prénom</label>
              <div class="input-wrapper">
                <i data-lucide="user" class="input-icon"></i>
                <input type="text" id="prenom" placeholder="Votre prénom" required />
              </div>
            </div>
            <div class="form-group">
              <label for="email">Adresse e-mail</label>
              <div class="input-wrapper">
                <i data-lucide="mail" class="input-icon"></i>
                <input
                  type="email"
                  id="email"
                  placeholder="votre@email.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label for="telephone">Téléphone</label>
              <div class="input-wrapper">
                <i data-lucide="phone" class="input-icon"></i>
                <input type="tel" id="telephone" placeholder="+229 01 00 00 00 00" required />
              </div>
            </div>
            <div class="form-group">
              <label for="mot-de-passe">Mot de passe</label>
              <div class="input-wrapper">
                <i data-lucide="lock" class="input-icon"></i>
                <input
                  type="password"
                  id="mot-de-passe"
                  placeholder="Minimum 6 caractères"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  class="toggle-mdp"
                  id="toggle-mdp"
                  aria-label="Afficher le mot de passe"
                >
                  <i data-lucide="eye"></i>
                </button>
              </div>
            </div>
            <p class="form-error" id="erreur-1"></p>
            <div class="step-actions">
              <button type="button" class="btn btn-primary" id="btn-suivant-1">
                Suivant
                <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </div>

          <div class="form-step" id="step-2">
            <div class="form-group">
              <label for="filiere">Filière</label>
              <div class="input-wrapper">
                <i data-lucide="graduation-cap" class="input-icon"></i>
                <select id="filiere" required>
                  <option value="">Choisir une filière…</option>
                  <option value="GL">Génie Logiciel (GL)</option>
                  <option value="IA">Intelligence Artificielle (IA)</option>
                  <option value="IM">Internet et Multimédia (IM)</option>
                  <option value="SI">Sécurité Informatique (SI)</option>
                  <option value="SEIoT">Systèmes Embarqués et IoT (SEIoT)</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Niveau d'études</label>
              <input type="hidden" id="niveau" required value="" />
              <div class="level-toggle-group" id="niveau-toggle-group">
                <button type="button" class="level-btn" data-value="L1">L1</button>
                <button type="button" class="level-btn" data-value="L2">L2</button>
                <button type="button" class="level-btn" data-value="L3">L3</button>
                <button type="button" class="level-btn" data-value="M1">M1</button>
                <button type="button" class="level-btn" data-value="M2">M2</button>
              </div>
            </div>
            <div class="form-group">
              <label>Disponibilités</label>
              <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 4px;">Cochez les créneaux où vous pouvez mentorer / être mentoré.</p>
              <div class="dispo-grid-container">
                <table class="dispo-table">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Lun</th>
                      <th>Mar</th>
                      <th>Mer</th>
                      <th>Jeu</th>
                      <th>Ven</th>
                      <th>Sam</th>
                      <th>Dim</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr data-slot="8h-10h">
                      <td class="hour-label">8h-10h</td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="lundi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mardi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mercredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="jeudi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="vendredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="samedi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="dimanche"><span class="dispo-checkbox-custom"></span></label></td>
                    </tr>
                    <tr data-slot="10h-12h">
                      <td class="hour-label">10h-12h</td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="lundi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mardi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mercredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="jeudi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="vendredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="samedi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="dimanche"><span class="dispo-checkbox-custom"></span></label></td>
                    </tr>
                    <tr data-slot="14h-16h">
                      <td class="hour-label">14h-16h</td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="lundi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mardi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mercredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="jeudi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="vendredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="samedi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="dimanche"><span class="dispo-checkbox-custom"></span></label></td>
                    </tr>
                    <tr data-slot="16h-18h">
                      <td class="hour-label">16h-18h</td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="lundi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mardi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mercredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="jeudi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="vendredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="samedi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="dimanche"><span class="dispo-checkbox-custom"></span></label></td>
                    </tr>
                    <tr data-slot="18h-20h">
                      <td class="hour-label">18h-20h</td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="lundi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mardi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="mercredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="jeudi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="vendredi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="samedi"><span class="dispo-checkbox-custom"></span></label></td>
                      <td><label class="dispo-checkbox-label"><input type="checkbox" data-day="dimanche"><span class="dispo-checkbox-custom"></span></label></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <p class="form-error" id="erreur-2"></p>
            <div class="step-actions">
              <button type="button" class="btn btn-retour" id="btn-retour-2">
                <i data-lucide="arrow-left"></i>
                Retour
              </button>
              <button type="button" class="btn btn-primary" id="btn-suivant-2">
                Suivant
                <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </div>

          <div class="form-step" id="step-3">
            <div class="form-group">
              <label>Points forts <span style="font-weight: 400; color: var(--text-muted)">(matières maîtrisées et à transmettre)</span></label>
              <div class="chips-container" id="points-forts-chips"></div>
            </div>
            <div class="form-group">
              <label>Points faibles <span style="font-weight: 400; color: var(--text-muted)">(matières où vous avez besoin d'aide)</span></label>
              <div class="chips-container" id="points-faibles-chips"></div>
            </div>
            <p class="form-error" id="erreur-3"></p>
            <div class="step-actions">
              <button type="button" class="btn btn-retour" id="btn-retour-3">
                <i data-lucide="arrow-left"></i>
                Retour
              </button>
              <button type="submit" class="btn btn-primary" id="btn-soumettre">
                <i data-lucide="user-check"></i>
                S'inscrire
              </button>
            </div>
          </div>
        </form>

        <p class="auth-separator">
          Déjà inscrit ?
          <a href="connexion.html">Se connecter</a>
        </p>
      </div>
    </div>

    <script src="../JS/script.js"></script>
  </body>
</html>
